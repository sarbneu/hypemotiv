# HypeMotiv nginx reverse proxy.
# Installed by setup-vps.sh at /etc/nginx/sites-available/hypemotiv
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Must be >= MAX_UPLOAD_MB (default 25) plus multipart overhead.
    client_max_body_size 30m;

    # Common proxy headers, applied to every location.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Media: large uploads and long-lived streaming downloads.
    location /api/files/ {
        client_max_body_size 30m;
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Everything else (health, sync, sounds, rip, email).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 120s;
    }
}
